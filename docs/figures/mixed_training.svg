<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1f2328;text-anchor:middle}
      .s{font-size:12px;fill:#57606a;text-anchor:middle}
      .ln{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">Mixed training for related low-resource languages</text>

  <rect x="20" y="60" width="200" height="50" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text class="t" x="120" y="84">Gamo – English</text>
  <text class="s" x="120" y="101">small parallel corpus</text>
  <rect x="20" y="125" width="200" height="50" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text class="t" x="120" y="149">Gofa – English</text>
  <text class="s" x="120" y="166">small parallel corpus</text>
  <rect x="20" y="190" width="200" height="50" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text class="t" x="120" y="214">Dawuro – English</text>
  <text class="s" x="120" y="231">small parallel corpus</text>

  <rect x="290" y="110" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="t" x="385" y="140">Mixed training set</text>
  <text class="s" x="385" y="160">related languages pooled</text>
  <text class="s" x="385" y="176">shared BPE vocabulary</text>

  <rect x="530" y="110" width="170" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="t" x="615" y="145">Transformer</text>
  <text class="s" x="615" y="165">encoder – decoder</text>

  <rect x="750" y="75" width="190" height="150" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="t" x="845" y="102">BLEU vs. baseline</text>
  <text class="s" x="845" y="132" style="font-size:14px">Gamo → En  +5.3</text>
  <text class="s" x="845" y="160" style="font-size:14px">Gofa → En  +5.0</text>
  <text class="s" x="845" y="188" style="font-size:14px">Dawuro → En  +3.7</text>

  <path class="ln" d="M220,85 C255,85 255,140 287,140"/>
  <path class="ln" d="M220,150 H287"/>
  <path class="ln" d="M220,215 C255,215 255,160 287,160"/>
  <path class="ln" d="M480,150 H527"/>
  <path class="ln" d="M700,150 H747"/>
  <text class="s" x="480" y="280">Gamo, Gofa and Dawuro are closely related Ometo (Omotic) languages of southern Ethiopia</text>
</svg>
