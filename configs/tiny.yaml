# Tiny model for smoke tests on the synthetic toy corpus (runs in about a minute on CPU)
model:
  layers: 2
  d_model: 64
  heads: 4
  ff_dim: 128
  dropout: 0.1

train:
  learning_rate: 1.0e-3
  schedule: constant
  max_tokens: 512
  vocab_size: 120
  max_len: 32
  epochs: 3
  patience: 3
  label_smoothing: 0.1
  clip_norm: 1.0
  warmup_steps: 50
  lr_factor: 1.0
